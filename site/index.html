<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Meanwhile Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Meanwhile Atlas — chart, ink, wax, thread */
:root{
  --chart:#EFE6D3; --panel:#F6EFE0; --panel-2:#E4D8BF; --ink:#2B2418; --ink-2:#5A4D3A; --tide:#A69878; --rule:#CDBFA3; --wax:#A8362B; --verd:#2E6B5E; --verd-soft:#D9E5DB;
  --eu:#B0302A; --me:#B86B1E; --sa:#8E7A12; --ea:#A33C73; --se:#5E7B16; --af:#2E7D4F; --na:#2F5FB3; --la:#6F4BA3; --oc:#1E7C9E;
  --ocean:#C9DBDA; --land:#F4EDDC; --grat:#BDD0CF; --river:#5D8CA3; --sea-ink:#3E6D7A; --relief:#6B563B;
  --f:Georgia,"Times New Roman",Times,serif;
  --fd:"Libre Caslon Text",Georgia,"Times New Roman",serif;
  --fu:"Source Sans 3","Source Sans Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --thread:3px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --chart:#1C1813; --panel:#241F19; --panel-2:#332C23; --ink:#EAE1CE; --ink-2:#C7BBA4; --tide:#857760; --rule:#4A3F31; --wax:#E06A5C; --verd:#79C2AF; --verd-soft:#243A33;
  --eu:#F08A80; --me:#F0A860; --sa:#E0C85A; --ea:#EE86BE; --se:#B9D25A; --af:#74CF92; --na:#86ABF5; --la:#C49AE8; --oc:#62C6EC;
  --ocean:#16211F; --land:#3A3328; --grat:#26312F; --river:#5F92A8; --sea-ink:#8DB6BF; --relief:#C2AA86; color-scheme:dark}}
:root[data-theme="dark"]{
  --chart:#1C1813; --panel:#241F19; --panel-2:#332C23; --ink:#EAE1CE; --ink-2:#C7BBA4; --tide:#857760; --rule:#4A3F31; --wax:#E06A5C; --verd:#79C2AF; --verd-soft:#243A33;
  --eu:#F08A80; --me:#F0A860; --sa:#E0C85A; --ea:#EE86BE; --se:#B9D25A; --af:#74CF92; --na:#86ABF5; --la:#C49AE8; --oc:#62C6EC;
  --ocean:#16211F; --land:#3A3328; --grat:#26312F; --river:#5F92A8; --sea-ink:#8DB6BF; --relief:#C2AA86; color-scheme:dark}

*{box-sizing:border-box}
html{height:100%;background:var(--chart)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.055;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.3 0 0 0 0 0.25 0 0 0 0 0.15 0 0 0 1 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");mix-blend-mode:multiply}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body::after{mix-blend-mode:screen;opacity:.04}}
:root[data-theme="dark"] body::after{mix-blend-mode:screen;opacity:.04}
.head,main{position:relative;z-index:1}
body{margin:0;min-height:100%;background:var(--chart);color:var(--ink);font:17.5px/1.6 var(--f);font-variant-numeric:oldstyle-nums;-webkit-font-smoothing:antialiased;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
a{color:var(--verd)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--verd);outline-offset:2px}
::selection{background:var(--verd-soft)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- running head ---------- */
.head{display:flex;align-items:baseline;gap:18px;padding:18px 0 14px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.head .name{font-size:22px;font-family:var(--fd);text-decoration:none;color:var(--ink);letter-spacing:.2px;white-space:nowrap}
.head .name i{font-style:italic;color:var(--ink-2)}
.where{font:15px var(--f);font-variant-caps:small-caps;letter-spacing:.05em;color:var(--ink-2);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;min-width:0;flex:1}
.where a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--rule)} .where a:hover{color:var(--ink);border-color:var(--ink)}
.where .now{color:var(--ink);font-weight:600}
.where .sep{color:var(--tide)}
.head nav{display:flex;gap:18px;font:15px var(--f);font-variant-caps:small-caps;letter-spacing:.08em;margin-left:auto}
.head nav a{color:var(--ink-2);text-decoration:none;border-bottom:2px solid transparent;padding-bottom:2px} .head nav a:hover{color:var(--ink)} .head nav a[aria-current]{color:var(--ink);border-color:var(--wax);font-weight:700}
.search{position:relative}
.snd{border:0;background:none;padding:4px 6px;font:13px var(--f);font-variant-caps:small-caps;letter-spacing:.06em;color:var(--ink-2)} .snd:hover{color:var(--ink)} .snd[aria-pressed="true"]{color:var(--wax)}
.search input{width:220px;max-width:40vw;padding:5px 0;border:0;border-bottom:1px solid var(--rule);background:none;font:15px var(--fu)}
.search input:focus{outline:0;border-color:var(--ink)}
.search input::placeholder{color:var(--ink-2);opacity:.7}
.results{position:absolute;right:0;top:calc(100% + 6px);width:380px;max-width:92vw;background:var(--panel);border:1px solid var(--rule);box-shadow:0 10px 30px rgba(10,20,40,.18);z-index:20;max-height:60vh;overflow:auto}
.results a{display:flex;gap:12px;align-items:baseline;padding:8px 12px;color:var(--ink);text-decoration:none;font-size:16px}
.results a:hover,.results a.hi{background:var(--panel-2)}
.results .yr{color:var(--ink-2);min-width:3.5ch;font-style:italic} .results .rg{margin-left:auto;color:var(--ink-2);font:13.5px var(--fu);white-space:nowrap}
.results .none{padding:10px 12px;color:var(--ink-2);font-style:italic}

/* ---------- common ---------- */
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:baseline;margin-right:6px}
.quiet{color:var(--ink-2)} .small{font:14.5px var(--fu)} .ital{font-style:normal}
h1,h2,h3,h4{font-weight:400;margin:0}
.lede{font-size:21px;line-height:1.45;max-width:36em}
.measure{max-width:68ch}
p{margin:0 0 .9em}
.rule{border:0;border-top:1px solid var(--rule);margin:22px 0}
.btn{border:1px solid var(--ink);background:none;padding:7px 14px;border-radius:0;font:15px var(--fu)}
.btn:hover{background:var(--ink);color:var(--chart)}
.btn.soft{border-color:var(--rule);color:var(--ink-2)} .btn.soft:hover{background:none;color:var(--ink);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--ink)}
.seg button{border:0;background:none;padding:7px 14px;font:15.5px var(--fu);text-align:left;line-height:1.2}
.seg button+button{border-left:1px solid var(--ink)}
.seg button i{display:block;font-size:13px;color:var(--ink-2);font-style:normal}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--chart)} .seg button[aria-pressed="true"] i{color:var(--chart);opacity:.8}

/* grades: the line is the argument */
.g{display:inline-flex;align-items:center;gap:8px;font:14.5px var(--fu);color:var(--ink-2);white-space:nowrap}
.g i{display:inline-block;width:26px;height:0;border-top:2.5px solid var(--verd)}
.g.Necessary i{border-top-width:3px}
.g.Sufficient i{border-top-width:1.5px}
.g.Contributing i{border-top-style:dashed}
.g.Contested i{border-top-style:dotted;border-top-width:3.5px}
.g.Coincident{color:var(--wax)} .g.Coincident i{border-color:var(--wax);border-top-style:dashed;position:relative} .g.Coincident i::after{content:"";position:absolute;left:11px;top:-6px;width:2px;height:10px;background:var(--wax);transform:rotate(35deg)}
.g.none i{border-color:var(--tide)}

/* the arrow note */
.note{border-left:var(--thread) solid var(--verd);padding:4px 0 4px 18px;margin:12px 0 14px;max-width:66ch}
.note.Contributing{border-left-style:dashed} .note.Contested{border-left-style:dotted} .note.Coincident{border-left-color:var(--wax);border-left-style:dashed}
.note .nh{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px;font:14.5px var(--fu);color:var(--ink-2)}
.note .nh .g{font-size:15px;color:var(--ink);font-weight:600}
.note p{margin:0 0 7px;font-size:16.5px;line-height:1.55}
.note p em{font:600 13.5px var(--fu);font-style:normal;color:var(--ink-2);margin-right:8px}
.note .meta{font:14px var(--fu);color:var(--ink-2);margin-top:8px}
.note .meta b{font-weight:400;color:var(--verd)}

/* cause/consequence rows */
.lk{list-style:none;margin:0;padding:0}
.lk li{padding:12px 0;border-top:1px solid var(--rule)}
.lk li:first-child{border-top:0}
.lk .row{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.lk .row a{color:var(--ink);text-decoration:none;font-size:18px} .lk .row a:hover{color:var(--verd)}
.lk .row .yr{font:15px var(--fu);color:var(--ink-2);min-width:4ch}
.lk .claim{margin:4px 0 0;font-size:16px;max-width:66ch}
.lk .guess{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center;font:14.5px var(--fu);color:var(--ink-2)}
.lk .guess button{border:1px solid var(--rule);background:none;padding:3px 10px;font:14.5px var(--fu);color:var(--ink)}
.lk .guess button:hover{border-color:var(--ink)}
.lk .verdict{margin-top:8px;font:15px var(--fu);color:var(--ink-2)} .lk .verdict b{font-weight:400;color:var(--verd)} .lk .verdict b.miss{color:var(--wax)}
.lk .guess button.open{border:0;background:none;padding:0;color:var(--verd);font:14.5px var(--fu);border-bottom:1px solid var(--rule);margin-left:8px}

/* ---------- ledger: thread margin + text column + medallion ---------- */
.ledger{display:grid;grid-template-columns:84px minmax(0,1fr) 300px;gap:0 32px;align-items:start;padding-top:22px}
.margin{position:relative;grid-column:1;min-height:100%}
.text{grid-column:2;min-width:0;max-width:70ch}
.aside{grid-column:3;position:sticky;top:18px}
.medal{width:300px;height:300px;position:relative;border-radius:50%;background:var(--ocean);box-shadow:inset 0 0 0 1px var(--rule)}
.medal canvas,.medal svg{position:absolute;inset:0;display:block;border-radius:50%}
.medal .cap{position:absolute;left:0;right:0;top:100%;text-align:center;font:14px var(--fu);color:var(--ink-2);padding:8px 0 0;pointer-events:none}
.aside .mean{margin-top:40px}
.mean h4{font:14.5px var(--f);font-variant-caps:small-caps;letter-spacing:.08em;color:var(--ink-2);margin:0 0 8px}
.mean .mi{padding:9px 0;border-top:1px solid var(--rule)}
.mean .mi a{color:var(--ink);text-decoration:none;font-size:16px} .mean .mi a:hover{color:var(--verd)}
.mean .mi .yr{font:15px var(--fu);color:var(--ink-2);margin-right:8px}
.mean .mi .rel{display:block;font-size:15px;color:var(--ink-2);margin-top:3px;line-height:1.45}
.mean .mnote{font:13.5px var(--fu);color:var(--ink-2);margin-top:8px}

/* the thread */
svg.thread{position:absolute;left:0;top:0;width:84px;height:100%;overflow:visible;pointer-events:none}
.thread path{fill:none;stroke:var(--verd);stroke-width:var(--thread);stroke-linecap:round}
.thread path.Contributing{stroke-dasharray:10 8} .thread path.Contested{stroke-dasharray:3 7} .thread path.Coincident{stroke:var(--wax);stroke-dasharray:10 8} .thread path.none{stroke:var(--tide)} .thread path.strand{stroke:var(--tide);stroke-width:1.5}
.thread path.draw{stroke-dasharray:none;animation:draw 1.1s ease-out both}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.thread circle.bead{fill:var(--chart);stroke:var(--tide);stroke-width:1.5}
.thread text{font:13px var(--fu);fill:var(--ink-2);paint-order:stroke;stroke:var(--chart);stroke-width:5px;stroke-linejoin:round} .thread text.Coincident{fill:var(--wax)}
.thread a circle{fill:var(--tide);stroke:none;cursor:pointer} .thread a circle.cur{fill:var(--wax)} .thread a:hover circle{fill:var(--verd)}
.ledger.plain{grid-template-columns:84px minmax(0,1fr)} .ledger.plain .text{max-width:72ch}
.knot{position:relative;padding:34px 0 10px}
.knot .num{position:absolute;left:-116px;top:22px;width:84px;text-align:center;font:italic 46px/1 var(--fd);color:var(--wax);background:var(--chart);padding:4px 0 2px;z-index:1;border:0;cursor:pointer}
.knot .num:hover{color:var(--verd)} .knot.lv0 .num::after{content:"open";display:block;font:13px var(--f);font-variant-caps:small-caps;letter-spacing:.08em;color:var(--ink-2);font-style:normal;margin-top:2px} .knot.lv0 .num:hover::after{color:var(--verd)}
.kctl{display:flex;gap:8px;margin:12px 0 0}
.kbtn{border:1px solid var(--ink);background:none;padding:5px 12px;font:14.5px var(--f);font-variant-caps:small-caps;letter-spacing:.06em;color:var(--ink)} .kbtn:hover{background:var(--ink);color:var(--chart)} .kbtn.soft{border-color:var(--rule);color:var(--ink-2)} .kbtn.soft:hover{background:none;color:var(--ink);border-color:var(--ink)}
.knot.lv0{padding-bottom:4px}
.knot .num i{position:absolute;left:50%;top:80px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--wax);box-shadow:0 0 0 4px var(--chart)}
.knot.cur .num{color:var(--ink)}
.knot .conn{font:600 14px var(--fu);color:var(--verd);margin:0 0 6px}
.knot .conn.but{color:var(--wax)}
.knot h2{font-size:30px;font-family:var(--fd);line-height:1.15;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.knot h2 a{color:var(--ink);text-decoration:none} .knot h2 a:hover{color:var(--verd)}
.knot h2 .yr{font:17px var(--fu);color:var(--ink-2)}
.knot .s1{font-size:19px;line-height:1.45;margin:8px 0 0;max-width:34em}
.knot .hinge{font:15px var(--fu);color:var(--ink-2);margin:8px 0 0}
.knot .hinge a{color:var(--verd)}
.knot .s2{margin:14px 0 0;font-size:17.5px;line-height:1.6}
.strand{position:relative;padding:10px 0 6px;margin-top:6px}
.strand .bead{position:absolute;left:-116px;top:16px;width:84px;text-align:center}
.strand .bead i{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--chart);border:2px solid var(--ink-2);box-shadow:0 0 0 3px var(--chart)}
.strand.t3 .bead i{width:8px;height:8px;border-width:1.5px}
.strand a.t{color:var(--ink);text-decoration:none;font-size:18px} .strand a.t:hover{color:var(--verd)}
.strand .yr{font:15px var(--fu);color:var(--ink-2);margin-right:8px}
.strand .hk{margin:3px 0 0;font-size:16px;color:var(--ink-2);line-height:1.5;max-width:62ch}
.strand .why{margin:5px 0 0;font-size:15px;color:var(--ink);max-width:62ch;line-height:1.5}
.figs{display:flex;flex-wrap:wrap;gap:4px 26px;margin:8px 0 0;font:15px var(--fu)}
.figs span b{font-weight:400;color:var(--ink)} .figs span{color:var(--ink-2)}
.ah{font:14.5px var(--f);font-variant-caps:small-caps;letter-spacing:.08em;color:var(--ink-2);margin:18px 0 6px}

/* story head */
.storyhead{padding:10px 0 6px}
.storyhead .kind{font:15px var(--fu);color:var(--ink-2)}
.storyhead h1{font-size:clamp(34px,4.6vw,56px);font-family:var(--fd);line-height:1.04;margin:6px 0 8px;text-wrap:balance;letter-spacing:-.2px}
.storyhead .sub{font-size:20px;color:var(--ink-2);margin:0 0 20px;font-style:italic}
.thesis{font-family:var(--fd);font-size:clamp(19px,2.1vw,23px);line-height:1.4;max-width:30em;margin:0 0 10px}
.thesis::before{content:"Thesis";display:block;font:14.5px var(--f);font-variant-caps:small-caps;letter-spacing:.08em;color:var(--ink-2);margin-bottom:6px}
.assume{font-size:16px;color:var(--ink-2);max-width:62ch;margin:12px 0 22px;line-height:1.5}
.assume summary{cursor:pointer;color:var(--ink)}
.assume ul{margin:6px 0 0;padding-left:18px}
.tierbar{display:flex;align-items:center;gap:16px;margin:18px 0 10px;flex-wrap:wrap}
.tierbar .l{font:14.5px var(--f);font-variant-caps:small-caps;letter-spacing:.08em;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:8px 0 10px} .legend .g{white-space:normal} .legend .g i{flex:none}
.foot{margin:34px 0 0;padding-top:18px;border-top:1px solid var(--rule);display:grid;gap:22px 32px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.foot h4{font:14.5px var(--f);font-variant-caps:small-caps;letter-spacing:.08em;color:var(--ink-2);margin:0 0 6px}
.foot p{font-size:16.5px;line-height:1.55;margin:0}
.foot ol{margin:0;padding-left:18px;font-size:15.5px;color:var(--ink-2);line-height:1.45} .foot li b{font-weight:400;color:var(--ink)}
.foot .awk{border-left:var(--thread) solid var(--wax);padding-left:14px}

/* ---------- atlas (front) ---------- */
.front{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(360px,.85fr);gap:0 40px;align-items:start;padding-top:18px}
.chartbox{position:relative;aspect-ratio:1;max-height:calc(100vh - 150px);background:var(--panel);overflow:hidden;cursor:grab;border:1px solid var(--rule);box-shadow:inset 0 0 0 4px var(--panel),inset 0 0 0 5px var(--rule);touch-action:none}
.chartbox canvas,.chartbox svg{position:absolute;inset:0;display:block}
.chartbox .tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--rule);padding:6px 10px;font-size:15px;max-width:260px;box-shadow:0 6px 18px rgba(10,20,40,.15)}
.chartbox .tip b{display:block;font-weight:400} .chartbox .tip span{font:14px var(--fu);color:var(--ink-2)}
.chartbox .zoom{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:4px}
.chartbox .rose{position:absolute;left:18px;bottom:18px;width:64px;height:64px;opacity:.55;pointer-events:none}
.chartbox .rose *{stroke:var(--ink-2);fill:none;stroke-width:1} .chartbox .rose .n{fill:var(--wax);stroke:none} .chartbox .rose text{fill:var(--ink-2);stroke:none;font:italic 11px var(--f)}
.chartbox .zoom button{width:32px;height:32px;border:1px solid var(--rule);background:var(--panel);font-size:18px}
.year{display:flex;align-items:center;gap:16px 20px;margin:0 0 6px;flex-wrap:wrap}
.year b{font-size:clamp(36px,4.6vw,60px);white-space:nowrap;font-family:var(--fd);font-weight:400;line-height:1;font-variant-numeric:lining-nums;min-width:3.2ch}
.year input[type=range]{width:100%;accent-color:var(--wax);height:2px;margin:0}
.year .yv{display:flex;flex-direction:column;gap:2px;min-width:5.2ch}
.year .age{font:italic 15px var(--f);color:var(--ink-2);letter-spacing:.01em}
.year .yslide{flex:1 1 320px;min-width:0;position:relative;padding-bottom:8px}
.year .ages{position:relative;height:5px;margin-top:6px}
.year .ages span{position:absolute;top:0;bottom:0}
.year .ages .ag0{background:var(--panel-2)}
.year .ages .ag1{background:var(--rule)}
.year .ticks{position:relative;height:14px;margin-top:3px;font:12px var(--fu);color:var(--ink-2)}
.year .ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
@media (max-width:640px){.year .ticks span:not(.k){display:none}}
.wc .agep{margin:0 0 10px}
.year .cap{font:14px var(--fu);color:var(--ink-2)}
.world{margin:6px 0 22px;font-size:16px;color:var(--ink-2);line-height:1.5}
.world b{font-weight:400;color:var(--ink)}
.world .cities{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:4px}
.front h1{font-size:clamp(30px,3.4vw,42px);font-family:var(--fd);line-height:1.12;margin:8px 0 10px;text-wrap:balance}
.front .lede{font-size:18px;color:var(--ink);margin:0 0 18px;max-width:40em}
.front #lists h3{font:14.5px var(--f);font-variant-caps:small-caps;letter-spacing:.08em;color:var(--ink-2);margin:26px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--ink)}
.arcs{list-style:none;margin:0;padding:0}

.periods button:hover .pt{color:var(--verd)} .periods .yrs{font:14px var(--fu);color:var(--ink-2);grid-row:span 2} .periods .pt{color:var(--ink)} .periods .pg{font:14px var(--fu);color:var(--ink-2)}
.periods li.cur .pt{color:var(--wax)} .periods li.cur .yrs{color:var(--wax);font-weight:600}
.pc .exits{display:flex;gap:16px;align-items:center;margin-top:18px}
.doors{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:0 40px;margin-top:30px;padding-top:10px;border-top:1px solid var(--ink)}
.doors h3{font:14.5px var(--f);font-variant-caps:small-caps;letter-spacing:.08em;color:var(--ink-2);margin:22px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--ink)}
@media (max-width:900px){ .fgrid,.doors{grid-template-columns:1fr} .fgrid .chartbox{max-height:none} .pc .facts{grid-template-columns:1fr 1fr} }

/* ---------- event card under the globe ---------- */
.evcard{margin-top:16px;padding:14px 0 4px;border-top:1px solid var(--ink)}
.evcard .kind{font:14px var(--fu);color:var(--ink-2)} .evcard h3{font-family:var(--fd);font-size:24px;line-height:1.15;margin:4px 0 8px} .evcard h3 a{color:var(--ink);text-decoration:none} .evcard h3 a:hover{color:var(--verd)}
.evcard p{font-size:16.5px;line-height:1.5;margin:0 0 8px;max-width:62ch} .evcard .in{font:15px var(--fu);color:var(--ink-2)} .evcard .in a{color:var(--verd)}
.deeper{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px} .deeper .btn{text-decoration:none;color:var(--ink)} .deeper .btn:hover{color:var(--chart)} .deeper .btn.soft:hover{color:var(--ink)}

/* ---------- tags ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{font:13px var(--f);font-variant-caps:small-caps;letter-spacing:.07em;color:var(--ink-2);text-decoration:none;border:1px solid var(--rule);padding:2px 9px 3px;border-radius:2px;line-height:1.3}
.chip:hover{color:var(--ink);border-color:var(--ink)} .chip.thread{color:var(--verd);border-color:var(--verd-soft)} .chip.thread:hover{border-color:var(--verd)}
.cg select{font:14px var(--fu);color:var(--ink);background:none;border:0;border-bottom:1px solid var(--rule);padding:1px 0;max-width:240px}
.century li.t1 a{color:var(--wax)}

/* the new map plate */
.gbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0 0 10px;font:14px var(--fu);color:var(--ink-2)}
.gbar select{font:14px var(--fu);color:var(--ink);background:var(--panel);border:1px solid var(--rule);padding:4px 6px}
.gbar .play[aria-pressed="true"]{border-color:var(--wax);color:var(--wax)}
.gbar .cmp{display:flex;align-items:center;gap:6px}
.fgrid.wide{grid-template-columns:minmax(0,1fr)}
.fgrid.wide .chartbox{aspect-ratio:2/1;max-height:none}
.fgrid.wide .pcol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 40px}
@media (max-width:900px){ .fgrid.wide .pcol{grid-template-columns:1fr} .fgrid.wide .chartbox{aspect-ratio:1.6/1} }
.chartbox .tip .hn{display:block;margin-top:4px;color:var(--ink-2);font:italic 13px var(--f)}
.chartbox .zoom button{line-height:1}
.ledger2{margin-top:18px;border-top:1px solid var(--rule);padding-top:12px}
.ledger2 .lh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ledger2 h3{font:400 17px var(--fd);margin:0}
.ledger2 .nav{display:flex;gap:6px} .ledger2 .nav button{font:13px var(--fu);border:1px solid var(--rule);background:var(--panel);padding:3px 9px;color:var(--ink-2)}
.ledger2 .nav button:hover{border-color:var(--ink);color:var(--ink)}
.ledger2 .sv{font:italic 14px var(--f);color:var(--ink-2);margin:8px 0}
.ledger2 ol.chg{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px}
.ledger2 .chg button{display:grid;grid-template-columns:58px minmax(0,1fr);gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px dotted var(--rule);padding:6px 2px;color:var(--ink);font:15px var(--f);cursor:pointer}
.ledger2 .chg button:hover{background:var(--panel)} .ledger2 .chg .d{font:13px var(--fu);color:var(--wax);font-variant-numeric:tabular-nums}

<main id="main"><p class="lede" style="padding-top:40px;color:var(--ink-2);font-style:italic">Opening the atlas.</p></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>

<script>
(async function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const main=$("#main"), whereEl=$("#where");
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- data ---------- */
let DATA,WORLD,RULES,GRAPH;
try{ [DATA,WORLD,RULES,GRAPH]=await Promise.all(["data.json","world.json","rules.json","graph.json"].map(u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u);return r.json()}))); }
catch(e){ main.innerHTML='<p class="lede" style="padding-top:40px">The atlas data did not load. Reload the page.</p>'; return; }

const EV=DATA.events, byId=Object.fromEntries(EV.map(e=>[e.id,e]));
const fy=e=>e.y+(e.m?(e.m-1)/12:0);
EV.sort((a,b)=>fy(a)-fy(b));
const REG=Object.fromEntries(DATA.regions.map(r=>[r.id,r]));
const rname=e=>REG[e.r]?REG[e.r].short||REG[e.r].name:"";
const LINKS=GRAPH.links||[], LK=Object.fromEntries(LINKS.map(l=>[l.id,l]));
const inLinks=id=>((GRAPH.ev[id]||{}).in||[]).map(k=>LK[k]).filter(Boolean);
const outLinks=id=>((GRAPH.ev[id]||{}).out||[]).map(k=>LK[k]).filter(Boolean);
const linkBetween=(a,b)=>LINKS.find(l=>l.f===a&&l.t===b);
function arrowBetween(a,b){ const d=linkBetween(a,b); if(d) return {link:d,grade:d.grade,via:null}; for(const l of outLinks(a)){ const h=linkBetween(l.t,b); if(h) return {link:l,grade:l.grade,via:l.t}; } return {link:null,grade:"none",via:null}; }
const GRADES=["Necessary","Sufficient","Contributing","Contested","Coincident"];
const GRADEHELP={Necessary:"take it away and the effect does not happen",Sufficient:"on its own it was enough",Contributing:"it raised the odds, among other causes",Contested:"serious schools disagree",Coincident:"it came before and did not cause"};

/* stories: graded ones from the graph, then the older ungraded ones */
const STORIES=[];
for(const S of GRAPH.stories||[]) STORIES.push(Object.assign({},S,{graded:true,kind:S.size||"arc"}));
for(const A of DATA.arcs||[]){
  if(STORIES.some(s=>s.id===A.id)) continue;
  const chapters=A.chapters.map((c,i)=>{ const items=A.items.filter(it=>it.chap===i).map(it=>byId[it.id]).filter(Boolean).sort((a,b)=>fy(a)-fy(b)); if(!items.length) return null; const h=items.find(e=>e.tier===1)||items[0]; return {id:"c"+(i+1),title:c.t,hinge:h.id,conn:null,s1:c.d,s2:"",support:items.filter(e=>e!==h).map(e=>e.id)}; }).filter(Boolean);
  if(!chapters.length) continue;
  STORIES.push({id:A.id,title:A.title,sub:A.short&&A.short!==A.title?A.short:"",span:A.span,kind:"story",graded:false,thesis:A.summary,chapters,themes:null,shelf:[],sources:A.sources||[]});
}
const SB=Object.fromEntries(STORIES.map(s=>[s.id,s]));
const MEM={}; STORIES.forEach(S=>S.chapters.forEach((c,i)=>{ (MEM[c.hinge]=MEM[c.hinge]||[]).push({story:S.id,chapter:i,role:"knot"}); (c.support||[]).forEach(s=>{ if(byId[s]) (MEM[s]=MEM[s]||[]).push({story:S.id,chapter:i,role:"strand"}); }); }));
const THEMES=GRAPH.themes||[], TB=Object.fromEntries(THEMES.map(t=>[t.id,t]));
const storiesOfTheme=id=>STORIES.filter(s=>s.themes&&(s.themes.primary===id||(s.themes.secondary||[]).includes(id)));
const threadLines=(S,opts={})=>{ const hs=S.chapters.map(c=>byId[c.hinge]).filter(e=>e&&e.lat!=null); const out=[]; for(let i=0;i<hs.length-1;i++){ out.push(Object.assign({coords:[[+hs[i].lon,+hs[i].lat],[+hs[i+1].lon,+hs[i+1].lat]],grade:S.graded?arrowBetween(hs[i].id,hs[i+1].id).grade:"none"},opts)); } return out; };
const CATS={political:"Political",war:"War",economic:"Economic",ideas:"Ideas",religion:"Religion",science:"Science and technology",culture:"Culture"};
const THREADS=DATA.threads||{};
const tagName=id=>CATS[id]||THREADS[id]||id;
const tagsOf=e=>[...(e.c||[]).map(c=>({id:c,kind:"cat"})),...(e.t||[]).map(t=>({id:t,kind:"thread"}))].filter(x=>CATS[x.id]||THREADS[x.id]);
const chips=e=>{ const seen=new Set(), ts=tagsOf(e).filter(t=>{ const n=tagName(t.id).toLowerCase(); if(seen.has(n)) return false; seen.add(n); return true; }); return ts.length?`<div class="chips">${ts.map(t=>`<a class="chip ${t.kind}" href="#tag-${t.id}">${esc(tagName(t.id))}</a>`).join("")}</div>`:""; };
const hasTag=(e,id)=>!id||(e.c||[]).includes(id)||(e.t||[]).includes(id);
const evLink=e=>`<a href="#event-${e.id}">${esc(e.h)}</a>`;
const yr=e=>e.y;


/* ---------- sound: synthesised, no files ---------- */
const SND={on:store.get("ma-sound",true),ctx:null,last:0,
  ac(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ this.ctx=null; } } if(this.ctx&&this.ctx.state==="suspended") this.ctx.resume(); return this.ctx; },
  noise(len){ const c=this.ac(); if(!c) return null; const b=c.createBuffer(1,Math.floor(c.sampleRate*len),c.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length); return b; },
  tick(){ if(!this.on) return; const c=this.ac(); if(!c) return; const t=c.currentTime; const s=c.createBufferSource(); s.buffer=this.noise(.035); const f=c.createBiquadFilter(); f.type="bandpass"; f.frequency.value=2600; f.Q.value=.9; const g=c.createGain(); g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+.05); s.connect(f).connect(g).connect(c.destination); s.start(t); const o=c.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(1800,t); o.frequency.exponentialRampToValueAtTime(900,t+.03); const g2=c.createGain(); g2.gain.setValueAtTime(.05,t); g2.gain.exponentialRampToValueAtTime(.001,t+.04); o.connect(g2).connect(c.destination); o.start(t); o.stop(t+.05); },

/* ---------- trace: the graph around an event ---------- */
const RANK={Coincident:0,Contested:1,none:2,Contributing:3,Sufficient:4,Necessary:5};
const edgesIn=id=>inLinks(id).map(l=>({f:l.f,t:id,grade:l.grade,link:l})).concat(((byId[id]||{}).causes||[]).filter(c=>byId[c.f]&&!inLinks(id).some(l=>l.f===c.f)).map(c=>({f:c.f,t:id,grade:"none",why:c.why})));
const edgesOut=id=>outLinks(id).map(l=>({f:id,t:l.t,grade:l.grade,link:l})).concat(EV.filter(x=>(x.causes||[]).some(c=>c.f===id)&&!outLinks(id).some(l=>l.t===x.id)).map(x=>({f:id,t:x.id,grade:"none",why:(x.causes.find(c=>c.f===id)||{}).why})));
function buildTrace(id,depth){ const cols={0:[id]}, seen=new Set([id]), edges=[], parent={}; const CAP=9, more={};
  for(const dir of [-1,1]){ let frontier=[id]; for(let d=1;d<=depth&&frontier.length;d++){ const next=[]; for(const n of frontier){ const es=(dir<0?edgesIn(n):edgesOut(n)).sort((a,b)=>RANK[b.grade]-RANK[a.grade]); for(const ed of es){ const o=dir<0?ed.f:ed.t; if(!seen.has(o)){ const col=cols[dir*d]=cols[dir*d]||[]; if(col.length>=CAP){ more[dir*d]=(more[dir*d]||0)+1; continue; } seen.add(o); col.push(o); next.push(o); parent[o]={via:n,grade:ed.grade,ed}; } if(seen.has(o)&&!edges.some(x=>x.f===ed.f&&x.t===ed.t)) edges.push(ed); } } frontier=next; } }
  return {cols,edges,parent,more}; }
function traceSVG(e,T){ const ks=Object.keys(T.cols).map(Number).sort((a,b)=>a-b); const CW=200, NW=168, RH=44, PAD=14; const W=ks.length*CW, rows=Math.max(...ks.map(k=>T.cols[k].length+(T.more[k]?1:0))); const H=rows*RH+PAD*2;
  const pos={}, colOf={}; ks.forEach((k,ci)=>{ T.cols[k].forEach(id=>colOf[id]=ci); const col=T.cols[k].slice().sort((a,b)=>fy(byId[a])-fy(byId[b])); const n=col.length+(T.more[k]?1:0); const top=(H-n*RH)/2; col.forEach((id,ri)=>{ pos[id]={x:ci*CW+16,y:top+ri*RH+RH/2}; }); if(T.more[k]) pos["more"+k]={x:ci*CW+16,y:top+col.length*RH+RH/2}; });
  const clip=(s,n)=>s.length>n?s.slice(0,n-1).trimEnd()+"…":s;
  let h=""; for(const ed of T.edges){ const a=pos[ed.f], b=pos[ed.t]; if(!a||!b||!(colOf[ed.f]<colOf[ed.t])) continue; const x1=a.x+NW, x2=b.x, mx=(x1+x2)/2; const t=ed.link?ed.link.note.claim:(ed.why||""); h+=`<path class="${ed.grade}" d="M${x1} ${a.y}C${mx} ${a.y} ${mx} ${b.y} ${x2} ${b.y}"><title>${esc(ed.grade==="none"?"In the record, ungraded. ":ed.grade+". ")}${esc(t)}</title></path>`; }
  for(const k of ks){ for(const id of T.cols[k]){ const p=pos[id], o=byId[id], cur=id===e.id; h+=`<a href="#event-${id}" class="n${cur?" cur":""}"><rect x="${p.x}" y="${p.y-RH/2+4}" width="${NW}" height="${RH-8}" rx="2"/><text x="${p.x+10}" y="${p.y-4}">${esc(clip(o.h,26))}</text><text class="y" x="${p.x+10}" y="${p.y+12}">${o.y}, ${esc(clip(o.where||rname(o),22))}</text><title>${esc(o.h)}, ${o.y}</title></a>`; } if(T.more[k]){ const p=pos["more"+k]; h+=`<text class="y" x="${p.x+10}" y="${p.y+4}">and ${T.more[k]} more</text>`; } }
  const labels=ks.map((k,ci)=>`<text class="col" x="${ci*CW+16}" y="10">${k<0?(k===-1?"caused by":Math.abs(k)+" hops back"):(k===0?"this event":(k===1?"led to":k+" hops on"))}</text>`).join("");
  return `<svg class="trace" viewBox="0 -4 ${W} ${H+4}" width="${W}" height="${H+4}">${labels}${h}</svg>`; }
function weakest(e,T){ const roots=Object.keys(T.parent).filter(id=>Object.keys(T.cols).some(k=>+k<0&&T.cols[k].includes(id))&&!edgesIn(id).some(x=>T.parent[x.f]||x.f===e.id)); const out=[]; for(const r of roots){ let n=r, steps=[], w=null; while(T.parent[n]){ const p=T.parent[n]; steps.push({f:n,t:p.via,grade:p.grade}); if(!w||RANK[p.grade]<RANK[w.grade]) w=steps[steps.length-1]; n=p.via; } if(!steps.length) continue; const ungraded=steps.filter(s=>s.grade==="none").length; out.push({root:byId[r],steps,w,ungraded}); } return out.sort((a,b)=>fy(a.root)-fy(b.root)).slice(0,6); }

  const stories=STORIES.filter(S=>!theme||(S.themes&&(S.themes.primary===theme||(S.themes.secondary||[]).includes(theme)))).slice().sort((a,b)=>(b.graded-a.graded)||(a.span[0]-b.span[0]));
  const groups=order==="region"?DATA.regions.map(r=>[r.name,stories.filter(S=>regionOf(S)===r.id)]).filter(g=>g[1].length):[["",stories]];
  const lane=S=>{ const hs=S.chapters.map(c=>byId[c.hinge]).filter(Boolean); let h=""; for(let i=0;i<hs.length-1;i++){ const gr=S.graded?arrowBetween(hs[i].id,hs[i+1].id).grade:"none"; h+=`<path class="${gr}" d="M${x(fy(hs[i])).toFixed(1)} ${LH/2}H${x(fy(hs[i+1])).toFixed(1)}"/>`; } const sup=S.chapters.flatMap(c=>(c.support||[]).map(s=>byId[s]).filter(Boolean)); sup.forEach(e=>{ if(e.tier===3&&!showAll) return; h+=`<circle class="s t${e.tier}" data-id="${e.id}" cx="${x(fy(e)).toFixed(1)}" cy="${LH/2}" r="${e.tier===3?1.8:2.6}"/>`; }); hs.forEach((e,i)=>{ h+=`<circle class="k" data-id="${e.id}" data-n="${i+1}" cx="${x(fy(e)).toFixed(1)}" cy="${LH/2}" r="4.5"/>`; }); return `<div class="lane"><a class="lt" href="#story-${S.id}"><b>${esc(S.title)}</b><i>${S.span[0]} to ${S.span[1]}${S.graded?", graded":""}</i></a><svg width="${W}" height="${LH}" viewBox="0 0 ${W} ${LH}">${h}</svg></div>`; };
  const regions=DATA.regions.map(r=>{ const es=EV.filter(e=>e.r===r.id&&(showAll||e.tier<3)); return `<div class="lane reg"><div class="lt"><b>${esc(r.short||r.name)}</b><i>${es.length} events</i></div><svg width="${W}" height="${LH}" viewBox="0 0 ${W} ${LH}">${es.map(e=>`<circle class="e t${e.tier}" data-id="${e.id}" cx="${x(fy(e)).toFixed(1)}" cy="${LH/2+(e.tier===1?0:(e.tier===2?-7:7))}" r="${e.tier===1?3.2:(e.tier===2?2.2:1.5)}" style="fill:var(--${r.id})"/>`).join("")}</svg></div>`; }).join("");
  grid.innerHTML=`<div class="lane axis"><div class="lt"><b>Year</b><i id="ycur">${year}</i></div><svg id="axis" width="${W}" height="44" viewBox="0 0 ${W} 44">${bands.map(([a,b,l])=>`<rect x="${x(a)}" y="0" width="${x(b)-x(a)}" height="44" class="band"/><text x="${x(a)+6}" y="12" class="bl">${l}</text>`).join("")}${ticks.map(t=>`<line x1="${x(t)}" x2="${x(t)}" y1="28" y2="44"/><text x="${x(t)+3}" y="39">${t}</text>`).join("")}</svg></div>
   ${groups.map(([name,ss])=>`${name?`<div class="lane grp"><div class="lt"><b>${esc(name)}</b><i>${ss.length} ${ss.length===1?"story":"stories"}</i></div><svg width="${W}" height="24"></svg></div>`:""}<div class="lanes">${ss.map(lane).join("")}</div>`).join("")}<div class="lane sep"><div class="lt"><b>Every event</b><i>by region</i></div><svg width="${W}" height="20"></svg></div><div class="lanes">${regions}</div><div class="cursor" id="cursor"></div>`;
  function placeCursor(){ const c=$("#cursor"); c.style.left=(LW+x(year))+"px"; $("#ycur").textContent=year; }
  placeCursor();
  $("#axis").addEventListener("click",e=>{ const r=$("#axis").getBoundingClientRect(); year=Math.round(TSCALE.invert(e.clientX-r.left)); year=Math.max(1440,Math.min(2025,year)); store.set("ma-year",year); placeCursor(); });
  $("#tth").onchange=e=>{ store.set("ma-ttheme",e.target.value); timelinePage(); };
  $$(".tlctl .seg button").forEach(b=>b.onclick=()=>{ store.set("ma-torder",b.dataset.o); timelinePage(); });
  $("#tall").onchange=e=>{ store.set("ma-tall",e.target.checked); timelinePage(); };
  grid.addEventListener("pointermove",e=>{ const c=e.target.closest("circle[data-id]"); if(!c){ tip.hidden=true; return; } const ev=byId[c.dataset.id]; const r=wrap.getBoundingClientRect(); tip.hidden=false; tip.style.left=Math.min(wrap.clientWidth-260,e.clientX-r.left+wrap.scrollLeft+12)+"px"; tip.style.top=(e.clientY-r.top+wrap.scrollTop+12)+"px"; tip.innerHTML=`<b>${esc(ev.h)}</b><span>${ev.y}, ${esc(ev.where||rname(ev))}${c.dataset.n?"; knot "+c.dataset.n:""}</span>`; });
  grid.addEventListener("pointerleave",()=>{ tip.hidden=true; });
  grid.addEventListener("click",e=>{ const c=e.target.closest("circle[data-id]"); if(c) location.hash="#event-"+c.dataset.id; });
  if(x(year)+LW>wrap.clientWidth-40) wrap.scrollLeft=x(year)-wrap.clientWidth/2+LW;
  page={destroy(){}};
}



/* ---------- page: tag ---------- */
function tagPage(id){
  if(!CATS[id]&&!THREADS[id]){ missing("tag"); return; }
  where([["Atlas","#atlas"],[tagName(id),"#tag-"+id]]);
  const es=EV.filter(e=>hasTag(e,id)).sort((a,b)=>fy(a)-fy(b)); const groups=d3.groups(es,e=>Math.floor(e.y/100)*100); const ord=n=>n===1?"st":n===2?"nd":n===3?"rd":"th";
  const knots=es.filter(e=>e.tier===1).length;
  main.innerHTML=`<div class="ledger plain"><div class="margin"></div><article class="text about"><div class="kind quiet small">${CATS[id]?"Category":"Thread"}</div><h1>${esc(tagName(id))}</h1><p class="lede">${es.length} events from ${es[0].y} to ${es[es.length-1].y}, ${knots} of them knots. <a href="#atlas" id="tagatlas">See them on the globe</a>.</p>${groups.map(([c,gs])=>`<section class="century"><h2>The ${c/100+1}${ord(c/100+1)} century</h2><ul>${gs.map(e=>`<li class="t${e.tier}"><a href="#event-${e.id}"><span class="yr">${e.y}</span>${esc(e.h)}</a> <span class="small quiet">${esc(rname(e))}</span></li>`).join("")}</ul></section>`).join("")}</article></div>`;
  $("#tagatlas").onclick=()=>{ store.set("ma-tag",id); };
  page={destroy(){}};
}

/* ---------- page: every knot ---------- */
function knotsPage(){
  where([["Atlas","#atlas"],["Every knot","#knots"]]);
  const set=new Map(); EV.filter(e=>e.tier===1).forEach(e=>set.set(e.id,e)); STORIES.filter(s=>s.graded).forEach(S=>S.chapters.forEach(c=>{ if(byId[c.hinge]) set.set(c.hinge,byId[c.hinge]); }));
  const all=[...set.values()].sort((a,b)=>fy(a)-fy(b)); const cent=y=>Math.floor(y/100)*100; const groups=d3.groups(all,e=>cent(e.y));
  const ord=n=>n===1?"st":n===2?"nd":n===3?"rd":"th";
  main.innerHTML=`<div class="ledger plain"><div class="margin"></div><article class="text about"><h1>Every knot, in order.</h1><p class="lede">${all.length} turning points from ${all[0].y} to ${all[all.length-1].y}. A knot is an event that a story turns on; most belong to more than one.</p>${groups.map(([c,es])=>`<section class="century"><h2>The ${c/100+1}${ord(c/100+1)} century</h2><ul>${es.map(e=>{ const m=(MEM[e.id]||[]).filter(x=>x.role==="knot"&&SB[x.story]&&SB[x.story].graded); return `<li><a href="#event-${e.id}"><span class="yr">${e.y}</span>${esc(e.h)}</a> <span class="small quiet ital">${esc(rname(e))}${m.length?"; knot "+(m[0].chapter+1)+" of "+esc(SB[m[0].story].title):""}</span></li>`; }).join("")}</ul></section>`).join("")}</article></div>`;
  page={destroy(){}};
}

/* ---------- page: about ---------- */
function aboutPage(){
  where([["Atlas","#atlas"],["About","#about"]]);
  main.innerHTML=`<div class="ledger plain"><div class="margin"></div><article class="text about">
   <h1>An atlas of causes.</h1>
   <p>Meanwhile Atlas places ${EV.length} events from 1440 to the present in their year and on the map, profiles ${POLS.length} states and periods behind the borders, and writes the arrows between events. Each arrow carries a claim, the best objection to it, the warrant that answers the objection, and a graded verdict. The purpose is analytic: a reader who finishes an arc should be able to say what carried the outcome, what merely accompanied it, and where the serious schools still disagree.</p>
   <p class="credo">History read as a chain of causes, with the weak links marked.</p>
   <h2>How the atlas is organised</h2>
   <div class="vocab">
    <div><b>Atlas</b><p>The whole: the globe, the years, and every arc, story and event.</p></div>
    <div><b>Arc</b><p>A long argument across centuries, built from turning points. The German Question runs from 1517 to 1990.</p></div>
    <div><b>Story</b><p>A shorter run of cause and effect inside an arc, or on its own. A thread is the smallest: one place, one decade, one question.</p></div>
    <div><b>Event</b><p>The unit. Each has a year, a place, a brief, its figures, its arrows in and out, and exits to Wikipedia and Britannica.</p></div>
   </div>
   <h2>Three depths inside a story</h2>
   <div class="vocab">
    <div><b>Knots</b><p>The turning points. Read only these and you have the story start to finish, with the grade of each arrow between them.</p></div>
    <div><b>Strands</b><p>The events between the knots, each with a line on why it belongs, and the claim behind each arrow.</p></div>
    <div><b>Fibres</b><p>The details: figures, the full arrow notes with objection, warrant, verdict and tests, and the audit trail.</p></div>
   </div>
   <h2>The grades</h2>
   <p>The thread in the margin changes with the grade of each arrow, so a story can be read by its line alone.</p>
   <div class="legend" style="flex-direction:column;align-items:flex-start;gap:8px">${GRADES.map(g=>gradeTag(g,g+": "+GRADEHELP[g])).join("")}</div>
   <p style="margin-top:14px">A Necessary or Sufficient arrow is solid. Contributing is dashed. Contested is dotted. Coincident is marked in red: the event came first and the reader should resist the inference. Every graded arrow records who graded it, whether a red team has checked it, and the date.</p>
   <h2>Themes</h2>
   <p>Ten themes cut across the arcs: Man and Power, Man and War, Man and Scarcity, and the rest. Each is a tension between two poles that no century has settled. Ideas are events in this atlas, placed in their year and linked to what shaped them, so a reader who meets Locke can follow the arrows back to the wars that produced him.</p>
   <h2>The globe</h2>
   <p>Borders change year by year. From 1886 they follow a dated record of every state and colony, so a border moves on the day a treaty, annexation or independence took effect. Before 1886 they follow a peer-reviewed geospatial record of the world's polities, in which each state's territory is drawn and dated period by period, often decade by decade; members of a larger union, such as the duchies of the Holy Roman Empire, are drawn inside it with the union's outer border. Where no state is recorded, the land is shaded faintly with the peoples of its region. Coastlines, rivers, lakes, mountain ranges and deserts come from a public-domain physical atlas. Every state on it has a profile for the period: its form of government, head, capital, religion, population and economy, where it came from and where it went next, with a timeline of its regimes. The globe colours either by empire or by form of government, the latter by the dominant form in each profile's period. Peoples mapped by territory rather than by state are marked as such.</p>
   <h2>Sources</h2>
   <p>Event briefs are written from the standard references and checked against Wikipedia and Britannica, both linked from every event. City sizes before 1950 follow Tertius Chandler; from 1950 they follow the UN's World Urbanization Prospects. Shares of world output follow Maddison. Religious shares follow the World Christian Database. Borders before 1886 are adapted from Cliopatria, the polity borders dataset of the Seshat Global History Databank (Bennett et al., <i>Scientific Data</i>, 2025), licensed CC BY 4.0; the atlas clips them to the coastline and colours them. From 1886 borders follow CShapes 2.0. Land outside any recorded state before 1886 is named from the historical-basemaps project (A. Ourednik, GPL-3.0). Every border was checked against dated research on 797 places from 1400 to 2025: names the dataset filed wrongly were corrected, changes were moved to the year of the treaty or conquest, and where a researched place shows a state that Cliopatria omits, that state's shape is taken from historical-basemaps. The colouring by empire is a rule set applied to the states' own names.</p>
   <h2>What this is for</h2>
   <p>The atlas is a tool for analysis before it is a tool for learning. It should give a reader a foundation for judging the present: which causes carried outcomes, how often the same mechanism recurs, and where confident narratives rest on contested links.</p>
  </article></div>`;
  page={destroy(){}};
}
function missing(kind){ where([["Atlas","#atlas"]]); main.innerHTML=`<div class="ledger plain"><div class="margin"></div><article class="text"><h1 style="font-size:32px;margin-top:20px">That ${kind} is not in the atlas.</h1><p class="lede" style="margin-top:10px">The link may be from an older edition. <a href="#atlas">Open the atlas</a> and search for it.</p></article></div>`; page={destroy(){}}; }

/* ---------- router ---------- */
let firstRoute=true;
function route(){ page.destroy(); sRes.hidden=true; if(!firstRoute) SND.page(); firstRoute=false; const h=(location.hash||"#atlas").slice(1); const m=h.match(/^(atlas|story|event|theme|themes|knots|about|timeline|meanwhile|tag)(?:-(.+))?$/); window.scrollTo(0,0);
  if(!m) return atlasPage(); const [,p,id]=m;
  if(p==="story"&&id) storyPage(id); else if(p==="event"&&id) eventPage(id); else if(p==="theme"&&id) themePage(id); else if(p==="themes") themesPage(); else if(p==="knots") knotsPage(); else if(p==="about") aboutPage(); else if(p==="timeline") timelinePage(); else if(p==="tag"&&id) tagPage(id); else atlasPage(); }
addEventListener("hashchange",route); route();
})();

</script>

</body></html>
