# Deploys the site to Cloudflare Workers on every push to main (after the checks).
# Needs one repository secret: CLOUDFLARE_API_TOKEN (Settings > Secrets and variables >
# Actions). The account id is not secret.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm run build
      - name: Deploy with wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 0effb947016baec29ad11af8089dc57c
          command: deploy
          # Static-assets-only workers need wrangler 4; the action's default is 3.x.
          wranglerVersion: "4.158.0"
