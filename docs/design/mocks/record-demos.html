<title>Record Layout Demos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one reading column, 20px margins. A switch at the top picks one of three ways to set The Record; the same
   seven pieces of text fill each. Colours and type are docs/design/palette.md. */
:root{
  --bg:#F6F2EC; --surface:#FCFAF6; --surface2:#EFE9E1; --ink:#1C1916; --ink2:#4D4843; --ink3:#7B746D; --title:#3B2217; --rule:#DCD2C7;
  --accent:#C81A12; --on-accent:#FFFFFF; --gilt:#B08A3E;
  --display:"EB Garamond",Georgia,"Times New Roman",serif; --body:"Newsreader",Georgia,serif; --ui:"Public Sans",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1C130F; --surface:#261A15; --surface2:#2E211B; --ink:#F2E9E0; --ink2:#C4B4A7; --ink3:#948174; --title:#F2E9E0; --rule:#3E2E26;
  --accent:#FF6B5C; --on-accent:#1C130F; --gilt:#C9A45C; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1C130F; --surface:#261A15; --surface2:#2E211B; --ink:#F2E9E0; --ink2:#C4B4A7; --ink3:#948174; --title:#F2E9E0; --rule:#3E2E26;
  --accent:#FF6B5C; --on-accent:#1C130F; --gilt:#C9A45C; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:17px/1.6 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:40rem;margin:0 auto;padding-block:18px 80px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
p{margin:0 0 14px;text-wrap:pretty}
.eyebrow{font:500 10.5px/1.2 var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
h1{margin:4px 0 0;font:500 28px/1.1 var(--display);color:var(--title)}
.lede{margin:6px 0 0;font:italic 400 16px/1.4 var(--display);color:var(--ink2)}

/* the switch between demos */
.pick{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;margin:14px calc(-1 * max(20px,env(safe-area-inset-left,0px))) 0;padding:8px max(20px,env(safe-area-inset-left,0px));background:var(--bg);border-bottom:1px solid var(--rule)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--gilt)}
.seg button{min-height:44px;padding:4px 4px;display:grid;align-content:center;justify-items:center;gap:3px;color:var(--ink3)}
.seg button+button{box-shadow:inset 1px 0 0 var(--rule)}
.seg b{font:600 13px/1 var(--ui);letter-spacing:.04em}
.seg span{font:500 10px/1.1 var(--ui);letter-spacing:.02em;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 -2px 0 var(--gilt)}
.why{margin:12px 0 0;padding:9px 12px;border:1px dashed var(--ink3);font:400 13px/1.45 var(--ui);color:var(--ink2)}
.why b{color:var(--ink);font-weight:600}

h2{font:500 27px/1.12 var(--display);margin:26px 0 10px;color:var(--title)}
h2::after{content:"";display:block;width:min(250px,72%);height:1.8px;margin-top:7px;background:linear-gradient(90deg,var(--gilt) 0%,var(--gilt) 50%,transparent 100%);clip-path:polygon(0 38%,34% 0,100% 44%,100% 56%,34% 100%,0 62%)}
ul{margin:0 0 14px;padding:0 0 0 1.1em;display:grid;gap:8px}
li::marker{color:var(--accent)}
li b{font-weight:600}
.tablewrap{overflow-x:auto;margin:0 0 14px}
table{border-collapse:collapse;width:100%;font:13.5px/1.4 var(--ui)}
th,td{text-align:left;vertical-align:top;padding:7px 10px 7px 0;border-bottom:1px solid var(--rule)}
th{font:600 10.5px/1.2 var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
td:nth-child(2){font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink);font-weight:600}
.idx{position:sticky;top:calc(61px + env(safe-area-inset-top,0px));z-index:6;display:flex;margin:0 calc(-1 * max(20px,env(safe-area-inset-left,0px))) 8px;padding:0 max(20px,env(safe-area-inset-left,0px));overflow-x:auto;scrollbar-width:none;background:var(--bg);border-bottom:1px solid var(--rule)}
.idx::-webkit-scrollbar{display:none}
.idx button{flex:none;min-height:36px;padding:0 8px;font:500 10px/1 var(--ui);letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);white-space:nowrap;box-shadow:inset 0 -1px 0 transparent}
.idx button:first-child{padding-left:0}
.idx button[aria-current="true"]{color:var(--ink);box-shadow:inset 0 -1px 0 var(--gilt)}
.sep{display:flex;align-items:center;gap:12px;margin:22px 0 20px}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--rule)}
.sep i{width:6px;height:6px;border:1px solid var(--gilt);transform:rotate(45deg)}

/* A. Read through: everything open, set as one long read */
.a-piece{scroll-margin-top:110px}
.a-piece .lab{display:flex;align-items:baseline;gap:10px;font:500 10.5px/1.2 var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.a-piece .lab b{font:500 10.5px/1 var(--ui);color:var(--gilt);font-variant-numeric:tabular-nums}
.a-piece h3{margin:5px 0 3px;font:500 23px/1.15 var(--display);color:var(--title)}
.a-piece .take{margin:0 0 10px;font:italic 400 17.5px/1.38 var(--display);color:var(--ink2)}

/* B. One at a time: a single piece on screen, with the next named below it */
.b-count{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0 2px;font:500 10.5px/1.2 var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.b-card{min-height:250px;padding:14px 0 6px}
.b-card h3{margin:0 0 3px;font:500 25px/1.14 var(--display);color:var(--title)}
.b-card .take{margin:0 0 12px;font:italic 400 17.5px/1.38 var(--display);color:var(--ink2)}
.b-nav{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ink3);border-bottom:1px solid var(--rule)}
.b-nav button{min-height:58px;padding:8px 2px;display:grid;align-content:center;gap:3px;text-align:left}
.b-nav button+button{text-align:right;box-shadow:inset 1px 0 0 var(--rule);padding-left:12px}
.b-nav em{font:normal 500 10px/1 var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.b-nav b{font:500 16.5px/1.15 var(--display);color:var(--title)}
.b-nav button:disabled{opacity:.35;cursor:default}
.b-dots{display:flex;justify-content:center;gap:7px;margin:12px 0 0}
.b-dots i{width:6px;height:6px;border:1px solid var(--gilt);transform:rotate(45deg)}
.b-dots i.on{background:var(--gilt)}

/* C. Answers first: the one-line answer is the headline; the heading shrinks to a label */
.c-top{display:flex;justify-content:space-between;align-items:center;margin:0 0 4px;font:400 12.5px/1.3 var(--ui);color:var(--ink3)}
.c-top button{min-height:40px;font:500 12.5px/1 var(--ui);color:var(--ink2);text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:4px;text-decoration-thickness:1px}
.c-row{border-top:1px solid var(--rule)}
.c-row:last-child{border-bottom:1px solid var(--rule)}
.c-row > button{display:grid;grid-template-columns:minmax(0,1fr) 16px;gap:2px 12px;align-items:center;width:100%;padding:12px 0 13px;text-align:left}
.c-row .lab{grid-column:1;font:500 10px/1.2 var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.c-row .ans{grid-column:1;font:500 19.5px/1.22 var(--display);color:var(--title);text-wrap:balance}
.c-row .ch{grid-column:2;grid-row:1 / span 2;width:8px;height:8px;border-right:1.5px solid var(--ink3);border-bottom:1.5px solid var(--ink3);transform:rotate(45deg);justify-self:center;transition:transform .25s}
.c-row.open .ch{transform:translateY(3px) rotate(225deg)}
.c-row.open .lab{color:var(--accent)}
.c-body{display:none;margin:0 0 14px;padding:2px 0 0 14px;border-left:1px solid var(--gilt)}
.c-row.open .c-body{display:block}
.c-body > :last-child{margin-bottom:0}
@media (prefers-reduced-motion:reduce){ .c-row .ch{transition:none} }

/* ===== Variants of "Answers first" (2026-11-12). Shared: no counter, no "Open all", one piece open at a time. ===== */
.v-body{display:none}
.v-row.open .v-body{display:block}
.v-body > :last-child{margin-bottom:0}
.v-row > button{width:100%;text-align:left}

/* 1. Open air: no rules and no chevrons. White space separates; a small diamond marks each piece and fills when open. */
.v1 .v-row{margin:0 0 22px}
.v1 .v-row > button{display:grid;grid-template-columns:14px minmax(0,1fr);gap:3px 10px;align-items:start}
.v1 .mk{grid-row:1 / span 2;width:7px;height:7px;margin-top:9px;border:1px solid var(--gilt);transform:rotate(45deg);transition:background .2s}
.v1 .open .mk{background:var(--gilt)}
.v1 .ans{font:500 20px/1.24 var(--display);color:var(--title);text-wrap:balance}
.v1 .lab{font:italic 400 14px/1.25 var(--display);color:var(--ink3)}
.v1 .v-body{margin:10px 0 0 24px}

/* 2. Numbered: a gilt numeral in the margin, the answer beside it, the section name as a quiet caption under it. */
.v2{border-top:1px solid var(--ink3)}
.v2 .v-row{border-bottom:1px solid var(--rule)}
.v2 .v-row > button{display:grid;grid-template-columns:26px minmax(0,1fr);gap:2px 8px;padding:13px 0 14px;align-items:baseline}
.v2 .num{grid-row:1 / span 2;font:500 22px/1 var(--display);color:var(--gilt);font-variant-numeric:lining-nums}
.v2 .ans{font:500 19px/1.24 var(--display);color:var(--title);text-wrap:balance}
.v2 .lab{font:500 9.5px/1.3 var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.v2 .open .num{color:var(--accent)}
.v2 .v-body{margin:0 0 16px 34px}

/* 3. Ledger: two columns like a reference table. The section name sits in a narrow left column, the answer on the right. */
.v3{border-top:1px solid var(--ink3)}
.v3 .v-row{border-bottom:1px solid var(--rule)}
.v3 .v-row > button{display:grid;grid-template-columns:86px minmax(0,1fr);gap:0 14px;padding:12px 0 13px;align-items:baseline}
.v3 .lab{font:500 9.5px/1.35 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.v3 .ans{font:500 17.5px/1.3 var(--display);color:var(--title)}
.v3 .open .lab{color:var(--accent)}
.v3 .v-body{margin:0 0 16px 100px}
.v3 .v-body .tablewrap{margin-left:-100px}
</style>

<div class="wrap">
  <p class="eyebrow">Event page · The Treaty of Versailles</p>
  <h1>Answers first, three ways</h1>
  <p class="lede">Three quieter variants of the layout you chose. The words are placeholders for the rewrite; judge the shape.</p>

  <div class="pick"><div class="seg" role="group" aria-label="Demo">
    <button type="button" id="pick1" data-d="1" aria-pressed="true"><b>1</b><span>Open air</span></button>
    <button type="button" id="pick2" data-d="2" aria-pressed="false"><b>2</b><span>Numbered</span></button>
    <button type="button" id="pick3" data-d="3" aria-pressed="false"><b>3</b><span>Ledger</span></button>
  </div></div>
  <p class="why" id="why"></p>

  <h2>The Record</h2>
  <div id="demo"></div>
</div>

<script>
(function(){
  var REC=[{"h": "The account", "s": "Paris, 18 January to 28 June 1919.", "b": "<p>The conference opened in Paris on 18 January 1919. The victors met without Germany or Soviet Russia. French Prime Minister Georges Clemenceau wanted Germany too weak to attack again. British Prime Minister David Lloyd George wanted a Germany that could still trade. US President Woodrow Wilson wanted a League of Nations. Clemenceau gave up his claim to the Rhine for an Anglo-American guarantee.<\/p><p>The German delegation received the terms on 7 May and signed at Versailles on 28 June.<\/p>"}, {"h": "What it did, and to whom", "s": "France and Poland gained land; Germany paid in land, arms and money.", "b": "<ul>\n          <li><b>Land.<\/b> Germany lost 13 percent of its European territory and every colony. France got Alsace-Lorraine back, and Poland got a corridor to the sea.<\/li>\n          <li><b>Arms.<\/b> The treaty capped the German army at 100,000 and disarmed the Rhineland.<\/li>\n          <li><b>Money.<\/b> The Allies set reparations at 132 billion gold marks in 1921. Germany paid about 20 billion.<\/li>\n          <li><b>Shandong.<\/b> Germany's rights in Shandong went to Japan, over China's protest.<\/li>\n        <\/ul>"}, {"h": "Why it held or failed", "s": "The terms held only while Britain and France enforced them.", "b": "<p>The treaty left Germany intact and surrounded by weak new states where Austria-Hungary and Russia had stood. The terms held only while Britain and France enforced them. By the 1930s British opinion considered German grievances fair.<\/p><p>One reading holds the terms were harsh enough to enrage and too weak to restrain. The other holds the terms were enforceable and the failure was the enforcers'.<\/p>"}, {"h": "By the numbers", "s": "Three figures and where each comes from.", "b": "<div class=\"tablewrap\"><table class=\"terms\">\n          <thead><tr><th>Figure<\/th><th>Value<\/th><th>Basis<\/th><\/tr><\/thead>\n          <tbody>\n            <tr><td>German territory lost in Europe<\/td><td class=\"num\">13%<\/td><td>Treaty terms<\/td><\/tr>\n            <tr><td>German army cap<\/td><td class=\"num\">100,000<\/td><td>Versailles, part V<\/td><\/tr>\n            <tr><td>Reparations<\/td><td class=\"num\">132 bn set<br>about 20 bn paid<\/td><td>London Schedule of Payments, 1921<\/td><\/tr>\n          <\/tbody><\/table><\/div>"}, {"h": "The common misreading", "s": "That reparations ruined Germany.", "b": "<p>Germany paid about 20 billion gold marks of the 132 billion set. The hyperinflation of 1923 came from the French occupation of the Ruhr and the German government's own printing of money.<\/p>"}, {"h": "Today", "s": "Three borders the treaty drew still stand.", "b": "<p>The Rhineland is German, Alsace is French, and the Polish corridor is Poland's coast.<\/p>"}, {"h": "The detail", "s": "A vote of 11 to 6 that the chair ruled lost.", "b": "<p>On 11 April 1919 Japan's proposal to write racial equality into the League Covenant won 11 of the 17 votes in commission. Wilson, in the chair, ruled that it needed unanimity, and the clause died.<\/p>"}];
  var WHY={
    '1':'<b>1. Open air.</b> No lines and no arrows. White space does the separating. A small gilt diamond marks each piece and fills when it is open. The section name sits under the answer in quiet italics. The calmest of the three; the tap target is the least obvious.',
    '2':'<b>2. Numbered.</b> A gilt numeral in the margin, the answer beside it, the section name as a small caption underneath. Hairlines between rows. Reads as a list of seven findings; the numbers give the eye a rail to run down.',
    '3':'<b>3. Ledger.</b> Two columns, like a reference table: the section name in a narrow left column, the answer on the right. The most ordered and the quickest to scan for one section; the answers are set a little smaller to fit.'
  };
  var host=document.getElementById('demo'), mode='1', open=-1;
  try{ var m=localStorage.getItem('recDemo2'); if(/^[123]$/.test(m))mode=m; }catch(e){}
  function row(r,i){ var on=i===open, inner;
    if(mode==='1') inner='<i class="mk" aria-hidden="true"></i><span class="ans">'+r.s+'</span><span class="lab">'+r.h+'</span>';
    else if(mode==='2') inner='<span class="num" aria-hidden="true">'+(i+1)+'</span><span class="ans">'+r.s+'</span><span class="lab">'+r.h+'</span>';
    else inner='<span class="lab">'+r.h+'</span><span class="ans">'+r.s+'</span>';
    return '<div class="v-row'+(on?' open':'')+'"><button type="button" data-i="'+i+'" aria-expanded="'+on+'">'+inner+'</button><div class="v-body">'+r.b+'</div></div>'; }
  function draw(){ host.className='v'+mode; host.innerHTML=REC.map(row).join(''); }
  host.addEventListener('click',function(e){ var b=e.target.closest('.v-row > button'); if(!b)return; var i=+b.dataset.i; open=open===i?-1:i; draw(); });
  function paint(){
    [].forEach.call(document.querySelectorAll('.seg button'),function(b){ b.setAttribute('aria-pressed',String(b.dataset.d===mode)); });
    document.getElementById('why').innerHTML=WHY[mode]; draw();
  }
  [].forEach.call(document.querySelectorAll('.seg button'),function(b){ b.addEventListener('click',function(){ mode=b.dataset.d; open=-1; try{ localStorage.setItem('recDemo2',mode); }catch(e){} paint(); window.scrollTo({top:0,behavior:'auto'}); }); });
  paint();
})();
</script>
